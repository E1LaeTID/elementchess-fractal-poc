name: macOS application

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build macOS application
        run: python -m PyInstaller --noconfirm --clean --log-level WARN ElementChess.spec
      - name: Package application
        run: |
          mkdir -p package/ElementChess-macOS
          cp -R dist/ElementChess.app package/ElementChess-macOS/
          cp README-MACOS.txt package/ElementChess-macOS/README.txt
          ditto -c -k --sequesterRsrc --keepParent package/ElementChess-macOS ElementChess-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ElementChess-macOS
          path: ElementChess-macOS.zip
          if-no-files-found: error
      - name: Attach application to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" ElementChess-macOS.zip --clobber
          else
            gh release create "${{ github.ref_name }}" ElementChess-macOS.zip --generate-notes --title "ElementChess ${{ github.ref_name }}"
          fi

